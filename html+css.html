<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栃木県立那須養護学校</title>

<style>
body{
    text-align:center;
    font-family:"Yu Gothic", sans-serif;
    background-color:#f5f9ff;
    margin:0;
    
    /* 💡 順に【上 右 下 左】の余白です。上だけを5pxに詰めました */
    padding: 0px 30px 30px 30px; 
}

h1{
    color:#003366;
    font-size:2.5em;
    margin-bottom:10px;
}

img{
    max-width:80%;
    height:auto;
    border:3px solid #003366;
    border-radius:10px;
    box-shadow:0 4px 8px rgba(0,0,0,0.2);
}

.welcome{
    display:inline-block;
    margin-top:10px;
    padding:12px 24px;
    font-size:1.5em;
    font-weight:bold;
    color:white;
    background:linear-gradient(135deg,#4facfe,#00c6ff);
    border-radius:50px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);

    animation: floating 2.5s ease-in-out infinite;
}

@keyframes floating{
    0%{
        transform: translateY(0);
    }
    50%{
        transform: translateY(-10px);
    }
    100%{
        transform: translateY(0);
    }
}</style>
</head>

<body>
<h1>栃木県立那須養護学校</h1>
<img src="昔の１棟.png">
<div class="welcome">
    那須養護学校のホームページへようこそ！
</div>
</body>
</html>
