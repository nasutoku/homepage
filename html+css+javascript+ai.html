<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栃木県立那須インクルーシブ学校</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

<style>
*{ margin:0; padding:0; box-sizing:border-box; }

body{
    min-height:100vh;
    font-family:"Yu Gothic","Meiryo",sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a8a, #38bdf8);
    color:white;
    overflow-x:hidden;
}

#cursor-light{
    position:fixed;
    width:350px;
    height:350px;
    background: radial-gradient(circle, rgba(255,255,255,.25), transparent 70%);
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:0;
}

.hero{
    position:relative;
    z-index:1;
    width:min(90%,900px);
    margin:20px auto;
    padding: 10px 40px 40px 40px;
    text-align:center;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.2);
    border-radius:30px;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
}

h1{ font-size:clamp(2rem,5vw,2.5rem); margin-bottom:15px; }

.image-container {
    position: relative;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

.school-image{
    width:100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: .5s;
}
.school-image:hover{ transform: scale(1.05); }

.slide-from-left { animation: slideLeftAndScale 1.5s forwards ease-out; }
@keyframes slideLeftAndScale {
    0% { transform: translateX(-100%) scale(0.93); opacity: 0; }
    100% { transform: translateX(0)     scale(1.0);  opacity: 1; }
}

.slide-from-right { animation: slideRightAndScale 1.5s forwards ease-out; }
@keyframes slideRightAndScale {
    0% { transform: translateX(100%) scale(0.93); opacity: 0; }
    100% { transform: translateX(0)    scale(1.0);  opacity: 1; }
}

#welcome{
    margin-top:20px;
    min-height: auto;
    font-size:1.8rem;
    font-weight:bold;
    line-height:1.2;
}

.description{ margin-top:5px; font-size:1.1rem; line-height:1.8; opacity:.95; }

.button{
    display:inline-block;
    margin-top:15px;
    padding:15px 30px;
    font-family: "Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
    font-weight: bold;
    background: linear-gradient(135deg, #60a5fa, #2563eb);
    border-radius:50px;
    cursor:pointer;
    transition:.3s;
}
.button:hover{ transform:translateY(-5px); }

.fade{ opacity:0; transform:translateY(30px); transition:1s; }
.fade.show{ opacity:1; transform:none; }

.fade-in-only { opacity: 0; transition: opacity 3.0s ease; }
.fade-in-only.show { opacity: 1; transform: none; }

/* カメラ状態表示 */
#camera-status {
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 8px 15px;
    border-radius: 5px;
    font-size: 0.8em;
    z-index: 9999;
}

/* 顔の向きインジケーター */
#face-indicator {
    position: fixed;
    top: 50px;
    right: 10px;
    background: rgba(0,0,0,0.6);
    color: #7dd3fc;
    padding: 8px 15px;
    border-radius: 5px;
    font-size: 1.1em;
    z-index: 9999;
    min-width: 110px;
    text-align: center;
}

/* カメラ映像プレビュー */
#camera-video {
    position: fixed;
    bottom: 10px;
    right: 10px;
    width: 160px;
    height: 120px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.3);
    z-index: 9998;
    transform: scaleX(-1);
    display: block;
}

/* ========== チャットボット ========== */

#chat-toggle {
    position: fixed;
    bottom: 140px; 
    right: 15px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #60a5fa, #2563eb);
    border: none;
    cursor: pointer;
    z-index: 10000;
    box-shadow: 0 4px 20px rgba(37,99,235,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    transition: transform .2s, box-shadow .2s;
}
#chat-toggle:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 25px rgba(37,99,235,0.8);
}

#chat-window {
    position: fixed;
    bottom: 210px;
    right: 15px;
    width: 340px;
    height: 460px;
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    z-index: 10000;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: opacity .25s, transform .25s;
}
#chat-window.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(20px) scale(0.97);
}

#chat-header {
    padding: 14px 18px;
    background: linear-gradient(135deg, rgba(96,165,250,0.25), rgba(37,99,235,0.25));
    border-bottom: 1px solid rgba(255,255,255,0.15);
    font-weight: bold;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 8px;
}

#chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
}
#chat-messages::-webkit-scrollbar { width: 4px; }
#chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

.chat-bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 0.88rem;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
}
.chat-bubble.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border-bottom-right-radius: 4px;
}
.chat-bubble.ai {
    align-self: flex-start;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.15);
    border-bottom-left-radius: 4px;
}
.chat-bubble.ai.typing {
    opacity: 0.6;
    font-style: italic;
}

#chat-input-area {
    padding: 12px;
    border-top: 1px solid rgba(255,255,255,0.12);
    display: flex;
    gap: 8px;
    align-items: center;
}
#chat-input {
    flex: 1;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 9px 13px;
    color: white;
    font-family: "Yu Gothic","Meiryo",sans-serif;
    font-size: 0.88rem;
    outline: none;
    resize: none;
    line-height: 1.4;
    height: 40px;
}
#chat-input::placeholder { color: rgba(255,255,255,0.4); }
#chat-input:focus { border-color: rgba(96,165,250,0.6); }

/* 💡 新しく追加した音声入力マイクボタン */
#chat-voice-btn {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    transition: background .2s, transform .15s;
    flex-shrink: 0;
}
#chat-voice-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }
#chat-voice-btn.recording {
    background: #ef4444; /* 録音中はボタンを赤くして目立たせる */
    animation: pulse 1.2s infinite;
    border-color: transparent;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
}

#chat-send {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, #60a5fa, #2563eb);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    transition: transform .15s;
    flex-shrink: 0;
}
#chat-send:hover { transform: scale(1.08); }
#chat-send:disabled { opacity: 0.4; cursor: default; transform: none; }
</style>
</head>

<body>

<div id="camera-status">カメラ準備中...（許可してください）</div>
<div id="face-indicator">😐 起動中</div>
<video id="camera-video" autoplay muted playsinline></video>

<button id="chat-toggle" title="AIチャット">💬</button>

<div id="chat-window" class="hidden">
    <div id="chat-header">🤖 那須特別支援学校案内AI</div>
    <div id="chat-messages">
        <div class="chat-bubble ai">こんにちは！那須特別支援学校（那須養護学校）について案内するよ！何でも聞いてね😊<br><br>🎤 マイクボタンを押すと、声で質問することもできるよ！<br><br>【きけることのれい】<br>・学校はどこにある？<br>・どんな学校？<br>・名物はなに？</div>
    </div>
    <div id="chat-input-area">
        <textarea id="chat-input" rows="1" placeholder="メッセージを入力..."></textarea>
        <button id="chat-voice-btn" title="音声入力">🎤</button>
        <button id="chat-send">➤</button>
    </div>
</div>

<div id="cursor-light"></div>

<div class="hero fade">
    <h1>栃木県立那須特別支援学校</h1>

    <div class="image-container">
        <img src="昔の１棟.png" class="school-image" id="school-image">
    </div>

    <div id="welcome" class="fade-in-only"></div>
    <div class="description"></div>

    <div class="button" id="changeImage">写真の変更</div>
</div>

<div style="margin-top: 600px; padding: 40px; text-align: center; color: rgba(255,255,255,0.6);">
    --- ホームページの下部エリア（顔を下にむけるとここまで自動スクロールします） ---
</div>

<script>
/* ===== 1. メッセージ ===== */
document.getElementById("welcome").textContent = "那須特別支援学校のホームページへようこそ！";


/* ===== 2. 写真切り替え ===== */
const images = ["昔の１棟.png", "sky.jpeg", "sunflower.jpeg"];
let currentIndex = 0;
const imgEl = document.getElementById("school-image");

function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    imgEl.className = "school-image";
    void imgEl.offsetWidth;
    imgEl.src = images[currentIndex];
    imgEl.classList.add("slide-from-left");
}

function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    imgEl.className = "school-image";
    void imgEl.offsetWidth;
    imgEl.src = images[currentIndex];
    imgEl.classList.add("slide-from-right");
}

document.getElementById("changeImage").addEventListener("click", () => nextImage());


/* ===== 3. MediaPipe Face Mesh による顔の向き検出 ===== */
const statusEl    = document.getElementById("camera-status");
const indicatorEl = document.getElementById("face-indicator");
const videoEl     = document.getElementById("camera-video");

let isCooldown = false;
function activateCooldown(ms = 1500) {
    isCooldown = true;
    setTimeout(() => { isCooldown = false; }, ms);
}

const NOSE_TIP  = 1;
const LEFT_EYE  = 33;
const RIGHT_EYE = 263;
const CHIN      = 152;
const FOREHEAD  = 10;

let pitchBaseline = null;
let baselineSamples = [];
const BASELINE_FRAMES = 30; 

function onResults(results) {
    if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        indicatorEl.textContent = "😶 顔なし";
        return;
    }

    const lm = results.multiFaceLandmarks[0];
    const nose     = lm[NOSE_TIP];
    const leftEye  = lm[LEFT_EYE];
    const rightEye = lm[RIGHT_EYE];
    const chin     = lm[CHIN];
    const forehead = lm[FOREHEAD];

    const eyeMidX  = (leftEye.x + rightEye.x) / 2;
    const eyeWidth = Math.abs(rightEye.x - leftEye.x) + 0.001;
    const yawRatio = (nose.x - eyeMidX) / eyeWidth;

    const faceHeight = Math.abs(chin.y - forehead.y) + 0.001;
    const eyeMidY    = (leftEye.y + rightEye.y) / 2;
    const rawPitch   = (nose.y - eyeMidY) / faceHeight;

    if (pitchBaseline === null) {
        baselineSamples.push(rawPitch);
        if (baselineSamples.length >= BASELINE_FRAMES) {
            pitchBaseline = baselineSamples.reduce((a, b) => a + b, 0) / baselineSamples.length;
            statusEl.textContent = "カメラ連動：稼働中 ✅";
        } else {
            indicatorEl.textContent = "📷 正面を向いてください...";
            return; 
        }
    }

    const pitchDelta = rawPitch - pitchBaseline;
    const YAW_THRESH   = 0.12;  
    const PITCH_UP     = -0.06; 
    const PITCH_DOWN   =  0.08; 

    let direction = "center";

    if      (yawRatio   >  YAW_THRESH)  direction = "left_face";
    else if (yawRatio   < -YAW_THRESH)  direction = "right_face";
    else if (pitchDelta <  PITCH_UP)    direction = "up";
    else if (pitchDelta >  PITCH_DOWN)  direction = "down";

    const labels = {
        center:      "😐 正面",
        left_face:   "⬅️ 左向き",
        right_face:  "➡️ 右向き",
        up:          "⬆️ 上向き",
        down:        "⬇️ 下向き"
    };
    indicatorEl.textContent = labels[direction];

    currentScrollDir = (direction === "up") ? -1
                     : (direction === "down") ?  1
                     : 0;

    if (!isCooldown) {
        if (direction === "right_face") {
            activateCooldown(1500);
            nextImage();
        } else if (direction === "left_face") {
            activateCooldown(1500);
            prevImage();
        }
    }
}

let currentScrollDir = 0; 
const SCROLL_SPEED = 6;   
const SCROLL_INTERVAL = 30; 

setInterval(() => {
    if (currentScrollDir !== 0) {
        window.scrollBy({ top: currentScrollDir * SCROLL_SPEED, behavior: "instant" });
    }
}, SCROLL_INTERVAL);

const faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: false,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.5
});
faceMesh.onResults(onResults);

async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 320, height: 240, facingMode: "user" }
        });
        videoEl.srcObject = stream;
        await videoEl.play();
        processFrame();
    } catch (err) {
        statusEl.textContent = "❌ カメラ許可が必要です";
        console.error(err);
    }
}
async function processFrame() {
    await faceMesh.send({ image: videoEl });
    requestAnimationFrame(processFrame);
}
startCamera();


/* ===== 4. その他の演出 ===== */
const light = document.getElementById("cursor-light");
document.addEventListener("mousemove", e => {
    light.style.left = e.clientX + "px";
    light.style.top  = e.clientY + "px";
});

const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add("show");
    });
});
document.querySelectorAll(".fade, .fade-in-only").forEach(el => observer.observe(el));


/* ===== 5. チャットボット（通信・API不要） ===== */
const chatToggle   = document.getElementById("chat-toggle");
const chatWindow   = document.getElementById("chat-window");
const chatMessages = document.getElementById("chat-messages");
const chatInput    = document.getElementById("chat-input");
const chatSend     = document.getElementById("chat-send");
const chatVoiceBtn = document.getElementById("chat-voice-btn"); // 💡 マイクボタン

chatToggle.addEventListener("click", () => {
    chatWindow.classList.toggle("hidden");
    if (!chatWindow.classList.contains("hidden")) chatInput.focus();
});

const qaDictionary = [
    { keywords: ["どこ", "場所", "住所", "アクセス"], reply: "那須特別支援学校は、栃木県那須塩原市にあるよ！緑に囲まれたとても素敵な場所なんだ。" },
    { keywords: ["どんな", "特徴", "紹介"], reply: "小学部、中学部、高等部があって、みんなで楽しく勉強や運動をしているよ！一人一人の個性を大切にする学校だよ。" },
    { keywords: ["名物", "イベント", "行事"], reply: "学校の周りの豊かな自然を活かした体験学習や、みんなで協力して創り上げる「学校祭」がとっても盛り上がるよ！" },
    { keywords: ["こんにちは", "はじめまして", "おはよ", "こんばん"], reply: "こんにちは！お話しできて嬉しいな。学校のことで気になることがあれば何でも聞いてね！" },
    { keywords: ["ありがとう", "助かっ"], reply: "どういたしまして！お役に立ててよかった。いつでも声をかけてね✨" }
];

function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    appendBubble(text, "user");
    chatInput.value = "";
    chatSend.disabled = true;
    autoResizeTextarea();

    const typingEl = appendBubble("かんがえ中...", "ai typing");

    setTimeout(() => {
        typingEl.remove();
        let matchedReply = "ごめんね、その質問はまだ勉強中なんだ。別の言い方をするか、「どこにある？」や「どんな学校？」などと聞いてみてね！";
        const lowerText = text.toLowerCase();
        for (const item of qaDictionary) {
            if (item.keywords.some(kw => lowerText.includes(kw))) {
                matchedReply = item.reply;
                break;
            }
        }
        appendBubble(matchedReply, "ai");
        chatSend.disabled = false;
        chatInput.focus();
    }, 600);
}

function appendBubble(text, classes) {
    const div = document.createElement("div");
    div.className = "chat-bubble " + classes;
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
}

function autoResizeTextarea() {
    chatInput.style.height = "auto";
    chatInput.style.height = Math.min(chatInput.scrollHeight, 96) + "px";
}
chatInput.addEventListener("input", autoResizeTextarea);
chatInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (!chatSend.disabled) sendMessage();
    }
});
chatSend.addEventListener("click", () => { if (!chatSend.disabled) sendMessage(); });


/* ===== 6. 💡 新機能：Web Speech APIによる音声認識の処理 ===== */

// ブラウザが音声認識に対応しているかチェックする
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
    // 対応していない古いブラウザ（一部の環境）ではマイクボタンを隠す
    chatVoiceBtn.style.display = "none";
} else {
    const recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';            // 日本語に設定
    recognition.interimResults = false;    // 途中の結果はいらない
    recognition.maxAlternatives = 1;       // 候補は1つだけでいい

    let isRecording = false;

    // マイクボタンを押したときの処理
    chatVoiceBtn.addEventListener("click", () => {
        if (!isRecording) {
            // 録音開始
            try {
                recognition.start();
            } catch (e) {
                console.error(e);
            }
        } else {
            // 途中で止める場合
            recognition.stop();
        }
    });

    // 録音が始まった瞬間
    recognition.onstart = () => {
        isRecording = true;
        chatVoiceBtn.classList.add("recording");
        chatInput.placeholder = "音声を聞き取り中...";
    };

    // 録音が終わった瞬間（話し終わったとき）
    recognition.onend = () => {
        isRecording = false;
        chatVoiceBtn.classList.remove("recording");
        chatInput.placeholder = "メッセージを入力...";
    };

    // 音声の聞き取りが成功し、文字に変換できたとき
    recognition.onresult = (event) => {
        const speechToText = event.results[0][0].transcript; // 変換された文字
        chatInput.value = speechToText; // 入力欄に文字を入れる
        autoResizeTextarea();
        
        // 💡 声が入ったらそのまま自動でAIに送信する
        sendMessage();
    };

    // エラーが起きたとき
    recognition.onerror = (event) => {
        console.error("音声認識エラー: ", event.error);
        isRecording = false;
        chatVoiceBtn.classList.remove("recording");
        chatInput.placeholder = "メッセージを入力...";
    };
}
</script>

</body>
</html>
