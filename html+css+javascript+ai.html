<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>栃木県立那須インクルーシブ学校</title>

<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:"Yu Gothic","Meiryo",sans-serif;
    background:
        linear-gradient(
            135deg,
            #0f172a,
            #1e3a8a,
            #38bdf8
        );
    color:white;
    overflow-x:hidden;
}

/* マウス追従ライト */

#cursor-light{
    position:fixed;
    width:350px;
    height:350px;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.25),
            transparent 70%
        );

    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:0;
}

/* メインカード */

.hero{
    position:relative;
    z-index:1;

    width:min(90%,900px);

    margin:20px auto;

    /* 上だけのスペースをきれいに詰めました */
    padding: 10px 40px 40px 40px; 

    text-align:center;    
    background:rgba(255,255,255,.12);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.2);

    border-radius:30px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.3);
}

/* タイトル */

h1{
    font-size:clamp(2rem,5vw,2.5rem); 
    margin-bottom:15px; /* 写真との間隔を少し調整 */
}

/* 💡 写真の横移動とサイズ変更をきれいに行うためのコンテナ */
.image-container {
    position: relative;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

/* 画像 */

.school-image{
    width:100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: .5s;
}

.school-image:hover{
    transform: scale(1.05); 
}

/* 💡 顔を右に向けたとき：次の写真が左側からふわっと広がりつつ出てくる */
.slide-from-left {
    animation: slideLeftAndScale 1.5s forwards ease-out;
}
@keyframes slideLeftAndScale {
    0% { transform: translateX(-100%) scale(0.93); opacity: 0; }
    100% { transform: translateX(0) scale(1.0); opacity: 1; }
}

/* 💡 顔を左に向けたとき：前の写真が右側からふわっと広がりつつ出てくる */
.slide-from-right {
    animation: slideRightAndScale 1.5s forwards ease-out;
}
@keyframes slideRightAndScale {
    0% { transform: translateX(100%) scale(0.93); opacity: 0; }
    100% { transform: translateX(0) scale(1.0); opacity: 1; }
}

/* メッセージ */

#welcome{
    margin-top:20px;
    min-height: auto; 

    font-size:1.8rem;
    font-weight:bold;
    line-height:1.2;  
}

/* 説明文 */

.description{
    margin-top:5px;
    font-size:1.1rem;
    line-height:1.8;
    opacity:.95;
}

/* ボタン */

.button{
    display:inline-block;

    margin-top:15px;

    padding:15px 30px;

    /* 💡 フォントを読みやすい太字の丸ゴシック風に設定しました */
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
    font-weight: bold;

    background:
        linear-gradient(
            135deg,
            #60a5fa,
            #2563eb
        );

    border-radius:50px;

    cursor:pointer;

    transition:.3s;
}

.button:hover{
    transform:translateY(-5px);
}

/* フェードイン（全体用） */

.fade{
    opacity:0;
    transform:translateY(30px);
    transition:1s;
}

.fade.show{
    opacity:1;
    transform:none;
}

/* メッセージ専用：その場でだんだん現れるフェードイン */
.fade-in-only {
    opacity: 0;
    transition: opacity 3.0s ease; /* 3秒かけてじっくりフェードイン */
}

/* 画面に表示されたら不透明度を1にする */
.fade-in-only.show {
    opacity: 1;
    transform: none; 
}

/* カメラの状態を表示する案内板 */
#camera-status {
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 8px 15px;
    border-radius: 5px;
    font-size: 0.8em;
    z-index: 9999;
}

</style>
</head>

<body>

<div id="camera-status">カメラ準備中...（許可してください）</div>

<div id="cursor-light"></div>

<div class="hero fade">

    <h1>栃木県立那須特別支援学校</h1>

    <div class="image-container">
        <img
            src="昔の１棟.png"
            class="school-image"
            id="school-image"
        >
    </div>

    <div id="welcome" class="fade-in-only"></div>

    <div class="description"></div>

    <div class="button" id="changeImage">
        写真の変更
    </div>

</div>

<div style="margin-top: 600px; padding: 40px; text-align: center; color: rgba(255,255,255,0.6);">
    --- ホームページの下部エリア（顔を下にむけるとここまで自動スクロールします） ---
</div>

<script>

/* -------------------------------------------
   1. 時間帯で挨拶変更
------------------------------------------- */

const today = new Date(); 
const hour = today.getHours();

let greeting = "";

if(hour < 12){
    greeting = "おはようございます！";
}
else if(hour < 18){
    greeting = "こんにちは！";
}
else{
    greeting = "こんばんは！";
}

const message =
    greeting +
    " 那須インクルーシブ学校のホームページへようこそ！";

/* メッセージ一括表示 */

const target = document.getElementById("welcome");
target.textContent = message; 


/* -------------------------------------------
   2. 写真切り替えのデータと処理
------------------------------------------- */
const images = [
    "昔の１棟.png",
    "校舎.png",        /* 切り替えたい他の画像ファイル名 */
    "学校の風景.png"    /* 切り替えたい他の画像ファイル名 */
];
let currentIndex = 0;
const imgEl = document.getElementById("school-image");

// 次の写真（左側から出てくる ＋ サイズが少し小さい状態から通常へ）
function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    imgEl.className = "school-image"; // 一度クラスをリセット
    void imgEl.offsetWidth;            // 画面リフレッシュ
    imgEl.src = images[currentIndex];
    imgEl.classList.add("slide-from-left");
}

// 前の写真（右側から出てくる ＋ サイズが少し小さい状態から通常へ）
function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    imgEl.className = "school-image"; 
    void imgEl.offsetWidth;            
    imgEl.src = images[currentIndex];
    imgEl.classList.add("slide-from-right");
}

// ボタンをクリックしたときも動くように連携
document.getElementById("changeImage").addEventListener("click", () => {
    nextImage();
});


/* -------------------------------------------
   3. カメラ・顔認識AI（WebGazer）の設定
------------------------------------------- */
let isCooldown = false; // 連打防止クールダウン

window.onload = async function() {
    const statusEl = document.getElementById("camera-status");

    // WebGazerの初期追跡スタート
    webgazer.setGazeListener(function(data, elapsedTime) {
        if (data == null || isCooldown) return;

        const width = window.innerWidth;
        const height = window.innerHeight;

        const x = data.x;
        const y = data.y;

        // 【顔を上に向ける】💡 0.20 から 0.35 に変更（上の方をなんとなく見れば動く）
if (y < height * 0.35) {
    window.scrollBy({ top: -40, behavior: 'smooth' });
}
// 【顔を下に向ける】💡 0.80 から 0.65 に変更（下の方をなんとなく見れば動く）
else if (y > height * 0.65) {
    window.scrollBy({ top: 40, behavior: 'smooth' });
}
        // 【顔を右に向ける】顔を右に向けると、次の写真が左側から
        else if (x > width * 0.85) {
            activateCooldown();
            nextImage();
        }
        // 【顔を左に向ける】顔を左に向けると、前の写真が右側から
        else if (x < width * 0.15) {
            activateCooldown();
            prevImage();
        }
    }).begin();

    // 自分の顔のプレビューと、AIが認識しているポイント(ドット)を表示
    webgazer.showVideoPreview(true).showPredictionPoints(true);
    statusEl.textContent = "カメラ連動：稼働中";
};

// 連続で写真が切り替わらないようにするタイマー（1.5秒待機）
function activateCooldown() {
    isCooldown = true;
    setTimeout(() => { isCooldown = false; }, 1500);
}

window.onbeforeunload = function() {
    webgazer.end();
};


/* -------------------------------------------
   4. その他の演出（マウスライト・フェードイン監視）
------------------------------------------- */

/* マウス追従ライト */
const light = document.getElementById("cursor-light");
document.addEventListener("mousemove", e => {
    light.style.left = e.clientX + "px";
    light.style.top = e.clientY + "px";
});

/* フェードイン監視 */
const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }
    });
});

document
.querySelectorAll(".fade, .fade-in-only")
.forEach(el=>observer.observe(el));

</script>

</body>
</html>
